[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awesome-api"
version = "1.0.0"
description = "Production-ready FastAPI platform exposing developer, security and networking utilities."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Awesome_API Contributors" }]
keywords = ["fastapi", "api", "utilities", "dns", "whois", "security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "idna>=3.6,<4.0",
    "httpx>=0.27,<0.29",
    "httpcore>=1.0,<1.1",
    "dnspython>=2.6,<3.0",
    "phonenumbers>=8.13,<9.0",
    "ua-parser>=0.18,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.0,<7.0",
    "python-whois>=0.9,<0.10",
    "redis>=5.0,<6.0",
    "prometheus-client>=0.20,<1.0",
    "PyYAML>=6.0,<7.0",
    "PyJWT>=2.8,<3.0",
    "sqlparse>=0.5,<1.0",
    "defusedxml>=0.7,<1.0",
    "Pillow>=10.2,<13.0",
    "pillow-heif>=1.3,<2.0",
    "fpdf2>=2.8,<3.0",
    "pypdfium2>=4.30,<6.0",
    "psd-tools>=1.9,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "regex>=2024.0.0,<2027.0.0",
    "playwright>=1.49,<2.0",
]

[project.optional-dependencies]
lint = [
    "ruff>=0.4,<1.0",
]
typecheck = [
    "mypy>=1.9,<3.0",
]
test = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.0.0,<2.0",
    "pytest-cov>=4.1,<6.0",
    "pytest-xdist>=3.6,<4.0",
    "hypothesis>=6.100,<7.0",
]
audit = [
    "pip-audit>=2.7,<3.0",
]
# Optional heavy AI background-removal runtime (onnxruntime + ~170 MB model).
# Not installed by default; the Image Service reports FEATURE_DISABLED until
# this extra is present and IMAGE_BACKGROUND_REMOVAL_ENABLED=true.
image-ai = [
    "rembg>=2.0,<3.0",
    "onnxruntime>=1.17,<2.0",
]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.0.0,<2.0",
    "pytest-cov>=4.1,<6.0",
    "pytest-xdist>=3.6,<4.0",
    "hypothesis>=6.100,<7.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.9,<3.0",
    "httpx>=0.27,<0.29",
    "httpcore>=1.0,<1.1",
    "pip-audit>=2.7,<3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
exclude = ["Tasks.md", "imgcompress"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S110", "S112", "S311"]
# These service modules use a deliberately compact one-statement-per-line
# style (kept intact by design). Silence only the style rules that result from
# that choice; all other lint/type safety still applies.
"app/services/toolbox_service.py" = ["E501", "E701", "E702", "SIM105"]
"app/services/web_tools_service.py" = [
    "E501", "E701", "E702", "ASYNC109", "N806", "N817", "S101", "SIM102", "SIM105",
]
"app/services/http_tools_service.py" = ["ASYNC109"]
"app/services/browser_intelligence_service.py" = [
    "E501", "E701", "E702", "E703", "S110", "S112",
]
"app/services/design_system_service.py" = ["E501", "E701", "E702", "E703"]
"app/api/v1/browser_intelligence.py" = ["E501"]
# Required network-backend interface: the timeout parameter is part of the
# httpcore promise, not a caller-controlled timeout.
"app/providers/web/ssrf.py" = ["ASYNC109"]
# Security-rule exceptions reviewed at the time of introduction (kept stable):
"app/core/config.py" = ["S104"]  # binds 0.0.0.0 by design for container deployments
"app/schemas/toolbox.py" = ["S105"]  # "token_type" is an API field name, not a secret
"app/services/mock_data_service.py" = ["S311"]  # deliberately non-cryptographic mock data
"app/services/phone_service.py" = ["S110"]  # cleanup path where failures are intentionally ignored
"app/services/dns_service.py" = ["S110"]  # best-effort resolver fallback branches
"app/services/dns_tools_service.py" = ["S112"]  # per-record best-effort continuation

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
files = ["app"]
ignore_missing_imports = true
exclude = ["tests", "imgcompress"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires network access (deselect with '-m \"not integration\"')",
]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
